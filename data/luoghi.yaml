# Anagrafica dei luoghi.
# Primo blocco: 20 luoghi principali della Terza Era.
# Regole: id stabile, nome visibile, tipo, alias (nomi alternativi), dentro
# (il luogo che lo contiene), descrizione breve. Le note spiegano i cambi di nome.
# I nomi seguono l'epub Bompiani 2004; gli alias servono alla ricerca e ai testi
# che usano il nome di un altro periodo.

- id: contea
  nome: Contea
  tipo: regione
  alias:
    - la Contea
    - Shire
  dentro: eriador
  descrizione: La terra degli Hobbit nell'Eriador occidentale, divisa in Decumani e attraversata dalla Grande Strada Est.
  nota: null

- id: hobbiville
  nome: Hobbiville
  tipo: villaggio
  alias:
    - Hobbiton
  dentro: contea
  descrizione: Il villaggio principale della Contea, costruito sulla Collina lungo la Grande Strada Est.
  nota: null

- id: casa-baggins
  nome: Casa Baggins

# Relazioni di parentela.
# Ogni voce è un arco: "da" e "a" sono ID di persone in data/persone.yaml.
#
# Tipi ammessi:
#   genitore  da = genitore, a = figlio (diretto)
#   coniuge   da e a = coniugi (si scrive una volta sola)
#
# I fratelli non si scrivono: il build li ricava dai genitori comuni.
# Ogni persona citata qui deve avere il campo "genere: m" o "genere: f".

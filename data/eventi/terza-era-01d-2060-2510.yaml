    - entita: popolo-nani-di-durin
      parte: Nani
      ruolo: popolo
      esito: si raduna nelle Montagne Grigie
  breve: >-
    Thorin I lascia Erebor e conduce i superstiti del Popolo di Durin nelle
    Montagne Grigie.
  lungo: >-
    Nel 2210 Thorin I lascia Erebor e si reca a nord, alle Montagne Grigie,

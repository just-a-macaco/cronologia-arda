# Schede della Terza Era, anni 2060-2510.
# Quarto blocco dell'Appendice B: Dol Guldur, i Nani, la Contea e Celebrían.
# Fonte: Il Signore degli Anelli, Appendice B (Bompiani 2004).

- id: dol-guldur-cresce
  titolo: Cresce il potere di Dol Guldur
  tipo: evento
  data:
    era: terza
    anno: 2060
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 2060"
  luoghi:
    - dol-guldur
    - bosco-atro
  fa_parte_di: null
  partecipanti:
    - entita: gruppo-saggi
      parte: Eldar e Istari
      ruolo: osservatori
      esito: temono il ritorno di Sauron
    - persona: sauron
      parte: Dol Guldur
      ruolo: signore nascosto
      esito: accresce il suo potere
  breve: >-
    Il potere di Dol Guldur cresce: i Saggi cominciano a temere che il suo
    padrone sia Sauron in persona.
  lungo: >-
    Nel 2060 il potere di Dol Guldur si accresce. I Saggi, che fino ad allora
    avevano pensato a uno dei Nazgûl, cominciano a sospettare che vi sia
    Sauron stesso, pronto a risorgere. È il preludio della Pace Vigile.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 2060"
  certezza: certa
  note: null


  breve: >-
    L'Oscuro Signore muove guerra a Gondor e travolge Osgiliath: la ricerca
    dell'Anello è diventata caccia.
  lungo: >-
    Il 20 giugno 3018 Sauron attacca Osgiliath. La città, già in rovina, viene
    travolta e i Nazgûl attraversano l'Anduin. Gondor chiede aiuto e Boromir
    parte da Minas Tirith il 4 luglio per cercare il significato di un sogno.
    Nello stesso periodo Thranduil viene assalito nel Bosco Atro e Gollum
    fugge. La Guerra dell'Anello comincia con una serie di mosse quasi
    simultanee.

    discute che cosa fare dell'Unico Anello. Si decide che non può essere
    usato né nascosto: va distrutto nel Monte Fato. Frodo si offre di portarlo.
    Nasce la Compagnia dei Nove Viandanti: Frodo, Sam, Merry, Pippin, Gandalf,
    Aragorn, Boromir, Legolas e Gimli. Il Consiglio è il momento in cui le
    storie sparse convergono in un'unica impresa.

- id: saruman-tradisce
  titolo: Saruman tradisce
  tipo: tradimento
  data:
    era: terza
    anno: 3000
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 3000"
  luoghi:
    - Isengard
    - Orthanc
    - Mordor
    - Contea
  fa_parte_di: null
  partecipanti:
    - nome: Saruman
      parte: Isengard
      ruolo: capo del Bianco Consiglio
      esito: usa il palantír e cade sotto il dominio di Sauron
    - nome: Sauron
      parte: Mordor
      ruolo: Signore Oscuro
      esito: irretisce Saruman
    - nome: le spie di Saruman
      parte: Isengard
      ruolo: informatori
      esito: riferiscono sulla Contea
  breve: >-
    L'ombra di Mordor si allunga. Saruman osa usare il palantír di Orthanc e
    ne resta irretito: da allora lavora in segreto per Sauron.
  lungo: >-
    Intorno al 3000 l'ombra di Mordor si estende. Saruman osa adoperare il
    palantír di Orthanc, ma Sauron, che possiede la Pietra d'Ithil, lo
    irretisce. Da questo momento Saruman tradisce definitivamente il Bianco
    Consiglio e lavora in segreto per il nemico. Le sue spie riferiscono che
    la Contea è rigorosamente custodita dai Raminghi: un'informazione che
    incuriosisce Sauron.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 3000"
  certezza: certa
  note: null

- id: festa-bilbo
  titolo: La festa d'addio di Bilbo
  tipo: evento
  data:
    era: terza
    anno: 3001
    mese: 9
    giorno: 22
    anno_fine: null
    precisione: giorno
    qualificatore: null
    calendario: contea
    testo: "22 settembre 3001"
  luoghi:
    - Contea
    - Hobbiville
    - Casa Baggins
  fa_parte_di: null
  partecipanti:
    - nome: Bilbo Baggins
      parte: Hobbit
      ruolo: festeggiato
      esito: parte e lascia l'Anello a Frodo
    - nome: Frodo Baggins
      parte: Hobbit
      ruolo: erede
      esito: riceve l'Anello
    - nome: Gandalf
      parte: Istari
      ruolo: ospite
      esito: comincia a sospettare la verità
  breve: >-
    Bilbo scompare dalla Contea lasciando l'Anello a Frodo. Gandalf comincia a
    sospettare che sia l'Unico Anello.
  lungo: >-
    Il 22 settembre 3001 Bilbo Baggins celebra il suo centoundicesimo
    compleanno con una grande festa. Alla fine del discorso indossa l'Anello,
    scompare davanti a tutti e lascia la Contea. Prima di partire ha affidato
    l'Anello a Frodo. Gandalf comincia a sospettare che quell'anello da
    bisaccia sia l'Unico Anello: da ora la vigilanza sulla Contea viene
    raddoppiata, e Gandalf cerca notizie di Gollum con l'aiuto di Aragorn.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 3001; Libro I, capitolo 1"
  certezza: certa
  note: >-
    La data è quella del calendario della Contea, come nell'Appendice B.


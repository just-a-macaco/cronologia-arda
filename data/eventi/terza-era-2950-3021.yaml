  lungo: >-
    Nel giugno 3018 Thranduil viene assalito nel Bosco Atro da una banda di
    Orchetti. Gollum approfitta del tumulto e fugge. Si pensa che, inseguito
    dagli Elfi e dai servitori di Sauron, si sia rifugiato a Moria; ma una
    volta scoperta la via del Cancello Occidentale non sarebbe riuscito a
    uscirne. In realtà Gollum seguirà i passi di Frodo.

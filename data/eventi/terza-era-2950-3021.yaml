# Schede complete degli eventi della Terza Era, anni 2950-3021.
# Fonte primaria: Il Signore degli Anelli, Appendice B (ed. Bompiani 2004,
# traduzione di Vittoria Alliata di Villafranca), verificata sull'epub.
# I nomi seguono l'edizione di riferimento; le varianti sono in `note`.

- id: sauron-si-dichiara
  titolo: Sauron si dichiara
  tipo: evento
  data:
    era: terza
    anno: 2951
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 2951"
  luoghi:
    - Mordor
    - Barad-dûr
    - Dol Guldur
  fa_parte_di: null
  partecipanti:
    - nome: Sauron
      parte: Mordor
      ruolo: Signore Oscuro
      esito: dichiara il proprio ritorno
    - nome: i Nazgûl
      parte: Mordor
      ruolo: servi
      esito: tre rioccupano Dol Guldur
    - nome: Gollum
      parte: Montagne Nebbiose
      ruolo: cercatore
      esito: si dirige verso Mordor
    - nome: Elrond
      parte: Imladris
      ruolo: signore elfico
      esito: rivela ad Aragorn la sua discendenza
    - nome: Aragorn
      parte: Dúnedain
      ruolo: erede di Isildur
      esito: riceve i frantumi di Narsil
  breve: >-
    Sauron annuncia apertamente il proprio ritorno, raduna le forze a Mordor e
    ricostruisce Barad-dûr. Tre Nazgûl rioccupano Dol Guldur.
  lungo: >-
    Nel 2951 Sauron dichiara apertamente il proprio ritorno: raduna le forze a
    Mordor e comincia a ricostruire Barad-dûr. Tre Nazgûl rioccupano Dol
    Guldur. Nello stesso anno Elrond rivela ad Aragorn, che ha vissuto a
    Gran Burrone sotto il nome di Estel, la sua vera discendenza e gli affida
    i frantumi di Narsil; Aragorn incontra Arwen e poi parte per le Terre
    Selvagge. La guerra dell'Anello non è ancora cominciata, ma i suoi
    protagonisti sono già in cammino.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 2951"
  certezza: certa
  note: null

- id: ultimo-consiglio
  titolo: L'ultima seduta del Bianco Consiglio
  tipo: consiglio
  data:
    era: terza
    anno: 2953
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 2953"
  luoghi:
    - Gran Burrone
    - Isengard
    - Brea
    - Decumano Sud
  fa_parte_di: null
  partecipanti:
    - nome: Saruman
      parte: Bianco Consiglio
      ruolo: capo
      esito: mente sull'Anello e si ritira a Isengard
    - nome: Gandalf
      parte: Bianco Consiglio
      ruolo: membro
      esito: viene spiato
    - nome: il Bianco Consiglio
      parte: Eldar e Istari
      ruolo: consiglio dei saggi
      esito: si scioglie
  breve: >-
    Il Consiglio discute degli Anelli e si scioglie. Saruman si ritira a
    Isengard e mette spie alle calcagna di Gandalf.
  lungo: >-
    Nel 2953 si tiene l'ultima seduta del Bianco Consiglio. Si discute la
    questione degli Anelli. Saruman finge di aver scoperto che l'Unico Anello,
    sceso lungo l'Anduin, è finito nel Mare. Poi si ritira a Isengard e ne fa
    la sua fortezza. Geloso e timoroso di Gandalf, gli mette delle spie alle
    calcagna e manda agenti a Brea e nel Decumano Sud. Il Consiglio non si
    riunirà mai più.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 2953"
  certezza: certa
  note: null


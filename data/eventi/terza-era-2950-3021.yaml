    - nome: gli abitanti dell'Ithilien
      parte: Gondor
      ruolo: popolazione
      esito: fuggono oltre l'Anduin
  breve: >-
    Il vulcano torna in eruzione: gli ultimi abitanti dell'Ithilien fuggono
    oltre l'Anduin.
  lungo: >-
    Nel 2954 il Monte Fato torna in eruzione. Il fumo e le ceneri rendono
    l'Ithilien sempre più difficile da abitare, e gli ultimi abitanti fuggono
    oltre l'Anduin. È il segno visibile che Mordor si sta risvegliando. Gondor
    perde anche quel che resta della sua provincia orientale.

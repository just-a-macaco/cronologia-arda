    - anduin
    - montagne-nebbiose
  fa_parte_di: null
  partecipanti:
    - persona: deagol
      parte: Sturoi
      ruolo: pescatore
      esito: trova l'Anello e viene ucciso
    - persona: gollum
      parte: Sturoi
      ruolo: assassino
      esito: prende l'Anello, diventa Gollum
    - entita: gruppo-bianco-consiglio
      parte: Eldar e Istari
      ruolo: consiglio dei saggi
      esito: si costituisce
  breve: >-
    Si costituisce il Bianco Consiglio. Presso l'Anduin, Déagol rinviene
    l'Unico Anello e viene ucciso dall'amico Sméagol.
  lungo: >-
    Nel 2463 si costituisce il Bianco Consiglio. Nello stesso anno, presso il
    Campo Gaggiolo, sulle rive dell'Anduin, lo Sturoi Déagol trova l'Unico
    Anello, perduto da Isildur oltre duemila anni prima. Il suo amico Sméagol
    lo uccide per prendere l'Anello. Pochi anni dopo, nel 2470, Sméagol,
    ormai corrotto, si nasconde nelle Montagne Nebbiose: diventa Gollum.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anni 2463-2470; Libro I, capitolo 2"
  certezza: certa
  note: null


    - entita: gruppo-assalitori-mordor
      parte: Mordor
      ruolo: esercito
      esito: distruggono Osgiliath
  breve: >-
    Un nuovo attacco colpisce Gondor: Osgiliath, già provata dalla peste, è
    rovinata definitivamente e il suo ponte di pietra crolla.
  lungo: >-
    Nel 2475 Gondor viene nuovamente attaccata. Osgiliath, già in declino dopo
    la peste e lo spostamento della corte, è definitivamente distrutta e il
    suo ponte di pietra crolla. La città che era stata la capitale del regno
    non sarà mai più ricostruita com'era. Gondor si difende, ma perde uno dei
    suoi simboli.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 2475"
  certezza: certa
  note: >-
    L'Appendice B non nomina gli assalitori; la scheda li indica come «forze
    di Mordor» in modo generico.

- id: battaglia-celebrant
  titolo: Battaglia del Campo di Celebrant
  tipo: battaglia
  data:
    era: terza
    anno: 2510
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 2510"
  luoghi:
    - campo-di-celebrant
    - calenardhon
    - limterso
    - argentaroggia
  fa_parte_di: null
  partecipanti:
    - persona: eorl-il-giovane
      parte: Éothéod
      ruolo: comandante
      esito: vince
    - persona: cirion
      parte: Gondor
      ruolo: Sovrintendente
      esito: chiede aiuto e concede la terra
    - entita: popolo-balchoth
      parte: Est
      ruolo: invasori
      esito: sconfitti
    - entita: popolo-esterling
      parte: Est
      ruolo: invasori
      esito: sconfitti
    - entita: popolo-orchetti
      parte: Montagne
      ruolo: alleati degli invasori
      esito: respinti
  breve: >-
    Orchetti ed Esterling dilagano nel Calenardhon: Eorl il Giovane li sbaraglia
    sul Campo di Celebrant e salva Gondor.
  lungo: >-
    Una grande schiera di Uomini Selvaggi invade il Rhovanion da nord-est,
    attraversa l'Anduin su zattere e conquista il Calenardhon, mentre gli
    Orchetti scendono dalle Montagne. Cirion, Sovrintendente di Gondor, chiede
    aiuto al popolo del Nord. Eorl il Giovane parte con un grande esercito di
    cavalieri e giunge alla battaglia del Campo di Celebrant, lo spazio verde
    fra l'Argentaroggia e il Limterso, dove l'esercito di Gondor era stato
    respinto oltre il Limterso. Eorl stermina i nemici e insegue i Balchoth
    fino a ucciderli tutti sui campi del Calenardhon.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 2510; Appendice A, Cirion ed Eorl"
  certezza: certa
  note: null

- id: rohan
  titolo: Il dono di Calenardhon e il Giuramento di Eorl
  tipo: fondazione
  data:
    era: terza
    anno: 2510
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 2510"
  luoghi:
    - calenardhon
    - rohan
  fa_parte_di: null
  partecipanti:
    - persona: cirion
      parte: Gondor
      ruolo: Sovrintendente
      esito: dona il Calenardhon
    - persona: eorl-il-giovane
      parte: Éothéod
      ruolo: condottiero
      esito: riceve la terra e presta il Giuramento
    - entita: popolo-rohirrim
      parte: Rohan
      ruolo: popolo
      esito: si stabiliscono nel Calenardhon
  breve: >-
    Cirion dona il Calenardhon a Eorl il Giovane, che presta il Giuramento di
    Eorl. I Rohirrim si stabiliscono nella terra che diventa il Mark.
  lungo: >-
    Per ringraziarlo dell'aiuto nella battaglia del Campo di Celebrant, Cirion
    dona a Eorl e alla sua gente il Calenardhon, la vasta terra fra l'Anduin,
    l'Argentaroggia e il Limterso, spopolata dalla peste e dalle invasioni.
    Eorl presta il Giuramento di Eorl, impegnandosi all'alleanza perpetua con
    i Signori di Gondor. I Rohirrim si stabiliscono nella nuova terra, che
    diventa il Mark dei Cavalieri. Nasce Rohan.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 2510; Appendice A, Cirion ed Eorl"
  certezza: certa
  note: >-
    La battaglia e il dono sono due eventi distinti dello stesso anno: hanno
    partecipanti e conseguenze diverse e vanno tenuti separati.


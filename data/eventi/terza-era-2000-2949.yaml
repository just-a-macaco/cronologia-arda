# Schede complete degli eventi della Terza Era, anni 2000-2949.
# Fonte primaria: Il Signore degli Anelli, Appendice B (ed. Bompiani 2004,
# traduzione di Vittoria Alliata di Villafranca), verificata sull'epub.
# I nomi seguono l'edizione di riferimento; le varianti sono in `note`.

- id: minas-ithil
  titolo: Caduta di Minas Ithil
  tipo: distruzione
  data:
    era: terza
    anno: 2002
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 2002"
  luoghi:
    - minas-morgul
    - mordor
  fa_parte_di: null
  partecipanti:
    - entita: gruppo-nazgul
      parte: Mordor
      ruolo: assedianti
      esito: conquistano la città
    - entita: regno-gondor
      parte: Gondor
      ruolo: difensore
      esito: perde Minas Ithil e il palantír
  breve: >-
    Dopo due anni d'assedio i Nazgûl prendono Minas Ithil e ne catturano il
    palantír. La città diventa Minas Morgul, la torre di stregoneria.
  lungo: >-
    Nel 2000 i Nazgûl escono da Mordor e assediano Minas Ithil, la città
    gemella di Minas Anor. Dopo due anni la città cade: i Nazgûl se ne
    impadroniscono, catturano il palantír che vi era custodito e la
    trasformano in Minas Morgul, la Torre della Stregoneria. Da allora Minas
    Ithil è un luogo di terrore, e il palantír finirà nelle mani di Sauron.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anni 2000-2002"
  certezza: certa
  note: null

- id: earnur
  titolo: La sparizione di Eärnur
  tipo: perdita
  data:
    era: terza
    anno: 2050
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 2050"
  luoghi:
    - minas-morgul
    - minas-tirith
  fa_parte_di: null
  partecipanti:
    - persona: earnur
      parte: Gondor
      ruolo: re
      esito: scompare
    - persona: mardil
      parte: Gondor
      ruolo: Sovrintendente
      esito: diventa Sovrintendente Regnante
    - persona: re-degli-stregoni
      parte: Mordor
      ruolo: sfidante
      esito: vittoria non testimoniata
    - entita: gruppo-scorta-cavalieri
      parte: Gondor
      ruolo: seguito del re
      esito: scompare
  breve: >-
    Il Signore di Morgul sfida Eärnur: il re cavalca fino a Minas Morgul e
    scompare. Mardil diventa il primo Sovrintendente Regnante.
  lungo: >-
    Nel 2043 Eärnur riceve la corona di Gondor. Il Re di Minas Morgul lo sfida
    a duello, rinfacciandogli di non averlo affrontato durante la guerra del
    Nord; Mardil, il Sovrintendente, riesce a trattenere il re. Anni dopo la
    sfida si ripete. Mardil non può più fermarlo: Eärnur cavalca fino al
    cancello di Minas Morgul con una piccola scorta. Di lui e dei suoi non si
    ha mai più notizia. A Gondor tutti pensano a una trappola. Mardil assume
    il governo come primo Sovrintendente Regnante, e Gondor resta senza re
    per quasi mille anni.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anni 2043-2050; Appendice A, Gondor"
  certezza: certa
  note: >-
    La sparizione è certa; la morte è presunta, non testimoniata. L'epub
    alterna «Eärnur» e «Earnur»: si adotta la forma con la dieresi.

- id: pace-vigile
  titolo: La Pace Vigile
  tipo: evento

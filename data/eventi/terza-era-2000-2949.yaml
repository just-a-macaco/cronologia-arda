- id: lungo-inverno
  titolo: Il Lungo Inverno
  tipo: distruzione
  data:
    era: terza
    anno: 2758
    mese: null
    giorno: null
    anno_fine: 2759
    precisione: intervallo
    qualificatore: null
    calendario: terza
    testo: "2758-2759"
  luoghi:
    - rohan
    - fosso-di-helm
    - edoras
    - gondor
    - contea
  fa_parte_di: null
  partecipanti:
    - persona: helm
      parte: Rohan
      ruolo: re
      esito: muore nel Fosso di Helm
    - persona: wulf
      parte: invasori
      ruolo: usurpatore
      esito: assedia Edoras
    - persona: frealaf
      parte: Rohan
      ruolo: nipote di Helm
      esito: caccia Wulf e fonda la seconda linea dei re
    - entita: gruppo-corsari-umbar
      parte: Umbar
      ruolo: invasori
      esito: assalgono Gondor
    - persona: gandalf
      parte: Istari
      ruolo: soccorritore
      esito: aiuta la Contea
  breve: >-
    Rohan, assalita da est e da ovest, è travolta: Helm si asserraglia nel
    Fosso e vi muore, mentre i Corsari incalzano Gondor. Il Lungo Inverno gela
    ogni terra e Gandalf soccorre la Contea.
  lungo: >-
    Nel 2758 Rohan viene attaccato da est e da ovest. Re Helm si rifugia nel
    Fosso di Helm, mentre Wulf assedia Edoras. Nello stesso periodo le flotte
    dei Corsari di Umbar assalgono Gondor. L'inverno che segue, il Lungo
    Inverno, è durissimo: gela le terre, uccide uomini e bestie e provoca
    grandi sofferenze nell'Eriador e nel Rohan. Gandalf soccorre la gente
    della Contea. Nel 2759 muore Helm; Fréaláf caccia Wulf e dà inizio alla
    seconda linea dei Re del Mark.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anni 2758-2759; Appendice A, Rohan"
  certezza: certa
  note: null


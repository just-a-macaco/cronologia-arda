  fa_parte_di: null
  partecipanti:
    - persona: gandalf
      parte: Istari
      ruolo: esploratore
      esito: entra a Dol Guldur
    - persona: sauron
      parte: Dol Guldur
      ruolo: signore nascosto
      esito: si ritira a est
    - entita: gruppo-nazgul
      parte: Mordor
      ruolo: spettri
      esito: attendono a Minas Morgul
  breve: >-
    Gandalf entra a Dol Guldur e Sauron si ritira a est. Inizia la Pace
    Vigile: per quasi quattro secoli i Nazgûl attendono in silenzio.
  lungo: >-
    Nel 2063 Gandalf si reca a Dol Guldur. Sauron, non ancora pronto allo
    scontro, indietreggia e si rifugia a est. Comincia quello che viene
    chiamato la Pace Vigile: per quasi quattro secoli Sauron resta nascosto e
    i Nazgûl attendono in silenzio a Minas Morgul. È una pace solo apparente:
    il male si prepara, non scompare.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 2063"
  certezza: certa
  note: null


    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 1944"
  luoghi:
    - Ithilien
    - Paludi Morte
    - Gondor
  fa_parte_di: null
  partecipanti:
    - nome: Ondoher
      parte: Gondor
      ruolo: re
      esito: muore
    - nome: Eärnil
      parte: Gondor
      ruolo: generale
      esito: vince la battaglia
    - nome: Arvedui
      parte: Arthedain
      ruolo: re
      esito: rivendica la corona di Gondor
    - nome: i Carrieri
      parte: Est
      ruolo: invasori
      esito: sconfitti e respinti
  breve: >-
    Re Ondoher cade contro i Carrieri; nel sud Eärnil li sconfigge in Ithilien
    e ne annienta l'esercito nella Battaglia del Campo. Arvedui di Arnor
    rivendica la corona, che va però a Eärnil II.
  lungo: >-
    Nel 1944 i Carrieri attaccano Gondor su più fronti. Re Ondoher cade in
    battaglia. Nel sud Ithilien Eärnil sconfigge il nemico, poi lo annienta
    nella Battaglia del Campo e lo respinge nelle Paludi Morte. Alla morte di
    Ondoher, Arvedui di Arthedain rivendica la corona di Gondor per via della
    moglie Firiel, ma il Consiglio di Gondor sceglie Eärnil, che diventa re
    nel 1945. La scelta spezza per sempre la possibilità di riunire i due
    regni.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anni 1944-1945; Appendice A, Gondor"
  certezza: certa
  note: null


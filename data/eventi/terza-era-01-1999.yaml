- id: lotta-stirpi
  titolo: La Lotta delle Stirpi
  tipo: guerra
  data:
    era: terza
    anno: 1432
    mese: null
    giorno: null
    anno_fine: 1447
    precisione: intervallo
    qualificatore: null
    calendario: terza
    testo: "1432-1447"
  luoghi:
    - Gondor
    - Osgiliath
    - Erui
    - Pelargir
    - Umbar
  fa_parte_di: null
  partecipanti:
    - nome: Valacar
      parte: Gondor
      ruolo: re
      esito: muore
    - nome: Eldacar
      parte: Gondor
      ruolo: erede legittimo
      esito: riconquista il trono
    - nome: Castamir
      parte: ribelli
      ruolo: usurpatore
      esito: sconfitto e ucciso
    - nome: Ornendil
      parte: Gondor
      ruolo: figlio di Eldacar
      esito: ucciso
  breve: >-
    Alla morte di re Valacar Gondor sprofonda nella guerra civile: Osgiliath
    brucia e il palantír va perduto, finché Eldacar torna e sconfigge
    l'usurpatore Castamir ai Guadi dell'Erui.
  lungo: >-
    Alla morte di re Valacar, figlio di una principessa del Rhovanion, una
    parte dei Dúnedain rifiuta l'erede Eldacar perché di sangue misto. Scoppia
    la Lotta delle Stirpi. Nel 1436 Osgiliath brucia e il suo palantír va
    perduto; Eldacar fugge nel Rhovanion e suo figlio Ornendil viene ucciso.
    Castamir l'Usurpatore prende il trono. Nel 1447 Eldacar ritorna con un
    esercito, sconfigge Castamir ai Guadi dell'Erui e assedia Pelargir. I
    figli di Castamir fuggono a Umbar, dove fonderanno una dinastia di
    Corsari.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anni 1432-1448; Appendice A, Gondor"
  certezza: certa
  note: >-
    La guerra è trattata come un solo evento con intervallo; le singole
    battaglie (Osgiliath 1436, Erui 1447, Pelargir 1447) possono diventare
    schede autonome in una fase successiva.

- id: grande-peste
  titolo: La Grande Peste
  tipo: distruzione
  data:
    era: terza
    anno: 1636
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null

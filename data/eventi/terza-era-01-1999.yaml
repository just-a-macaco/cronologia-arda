  lungo: >-
    Arvedui fugge verso nord e annega nella Baia di Forochel; con lui vanno
    perduti i palantíri di Annúminas e di Amon Sûl. Eärnur, figlio del re di
    Gondor, porta una flotta nel Lindon e marcia contro Angmar. Nella
    Battaglia di Fornost il Re degli Stregoni viene sconfitto e inseguito sino
    agli Erenbrulli, dove scompare dal Nord. Glorfindel pronuncia allora la
    profezia: il Re degli Stregoni non cadrà per mano di un uomo.

  lungo: >-
    I Saggi, cioè gli Istari e i capi degli Eldar, si accorgono che un potere
    malefico si è stabilito nella fortezza di Dol Guldur, nel Bosco Atro.
    Ritengono che si tratti di uno dei Nazgûl, uno degli Schiavi dell'Anello.
    Solo molto più tardi scopriranno che il padrone del luogo è Sauron in

    - Minas Anor
    - Eriador
    - Baranduin
  fa_parte_di: null
  partecipanti:
    - nome: Telemnar
      parte: Gondor
      ruolo: re
      esito: muore
    - nome: i figli di Telemnar
      parte: Gondor
      ruolo: principi
      esito: muoiono
    - nome: Gondor
      parte: Gondor
      ruolo: regno
      esito: perde gran parte della popolazione
    - nome: i Periannath
      parte: Hobbit
      ruolo: popolo
      esito: sopravvivono con gravi perdite
  breve: >-
    L'epidemia fa strage a Gondor: muoiono re Telemnar e i suoi figli, e
    appassisce l'Albero Bianco. La peste dilaga a nord e devasta l'Eriador.
  lungo: >-
    La Grande Peste colpisce Gondor nel 1636. Muoiono re Telemnar e tutti i
    suoi figli; l'Albero Bianco appassisce a Minas Anor. L'epidemia risale
    verso nord e verso ovest e devasta l'Eriador, lasciando molte regioni
    deserte. Oltre il Baranduin i Periannath sopravvivono, ma con perdite
    ingenti. È uno dei colpi da cui Gondor non si riprenderà mai del tutto.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 1636"
  certezza: certa
  note: null


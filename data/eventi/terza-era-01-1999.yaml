  breve: >-
    Re Tarondor sposta la residenza a Minas Anor e pianta un nuovo seme
    dell'Albero Bianco. Osgiliath declina e Gondor smette di presidiare
    Mordor.
  lungo: >-
    Re Tarondor sposta la residenza reale da Osgiliath a Minas Anor e vi
    pianta un nuovo seme dell'Albero Bianco. Osgiliath, già provata dalla
    peste, comincia il suo declino. Soprattutto, Gondor cessa di sorvegliare
    Mordor: le fortezze che tenevano a bada la terra di Sauron vengono
    abbandonate. È una decisione che peserà secoli dopo.
  fonti:

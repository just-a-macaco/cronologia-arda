    finisce il regno di Arnor. Arvedui, ultimo re, fugge a nord.
  lungo: >-
    Il Re degli Stregoni invade l'Arthedain con forze soverchianti e conquista
    Fornost. Re Arvedui, ultimo sovrano del Regno del Nord, fugge verso le
    terre del nord. Dopo più di mille anni dalla fondazione, Arnor cessa di
    esistere come regno. I Dúnedain del Nord diventeranno un popolo errante e
    segreto, i Raminghi.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 1974; Appendice A, Arnor"
  certezza: certa
  note: null


# Schede complete degli eventi della Terza Era, anni 1-1999.
# Fonte primaria: Il Signore degli Anelli, Appendice B (ed. Bompiani 2004,
# traduzione di Vittoria Alliata di Villafranca), verificata sull'epub.
# Ogni scheda ha due testi: `breve` per la linea del tempo, `lungo` per la pagina.
# I nomi seguono l'edizione di riferimento; le varianti sono in `note`.

- id: inizio-terza
  titolo: Inizia la Terza Era
  tipo: evento
  data:
    era: terza
    anno: 1
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 1"
  luoghi:
    - Mordor
    - Barad-dûr
  fa_parte_di: null
  partecipanti:
    - nome: Sauron
      parte: Mordor
      ruolo: Signore Oscuro
      esito: sconfitto
    - nome: Isildur
      parte: Ultima Alleanza
      ruolo: re di Gondor
      esito: prende l'Unico Anello
    - nome: Elendil
      parte: Ultima Alleanza
      ruolo: re
      esito: muore
    - nome: Gil-galad
      parte: Ultima Alleanza
      ruolo: Alto Re degli Elfi
      esito: muore
  breve: >-
    Sauron è sconfitto e Isildur prende l'Unico Anello. Finisce la Seconda Era
    e comincia il computo della Terza.
  lungo: >-
    L'Ultima Alleanza di Elfi e Uomini assedia Barad-dûr. Sauron esce dalla
    torre e affronta Elendil e Gil-galad: tutti e tre periscono, ma Sauron
    viene abbattuto. Isildur, figlio di Elendil, gli taglia l'Anello dalla mano
    e lo tiene per sé invece di distruggerlo. Con la caduta di Sauron termina
    la Seconda Era; gli Schiavi dell'Anello svaniscono nelle ombre.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, Seconda Era 3441"
  certezza: certa
  note: null

- id: isildur-anello
  titolo: Isildur muore e l'Anello è perduto
  tipo: perdita
  data:
    era: terza
    anno: 2
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 2"
  luoghi:
    - Minas Anor
    - Campo Gaggiolo
    - Anduin
  fa_parte_di: null
  partecipanti:
    - nome: Isildur
      parte: Gondor
      ruolo: re
      esito: muore
    - nome: Meneldil
      parte: Gondor
      ruolo: re del Sud
      esito: riceve il regno
    - nome: Ohtar
      parte: Gondor
      ruolo: scudiero di Isildur
      esito: porta i frantumi di Narsil a Imladris
    - nome: i tre figli maggiori di Isildur
      parte: Gondor
      ruolo: principi
      esito: muoiono
  breve: >-
    Isildur pianta a Minas Anor un seme dell'Albero Bianco, affida il Sud a
    Meneldil, poi cade in un agguato al Campo Gaggiolo. L'Anello sprofonda
    nell'Anduin.
  lungo: >-
    Isildur pianta un seme dell'Albero Bianco a Minas Anor e affida il Regno
    del Sud a Meneldil. Sulla via del ritorno a nord, presso il Campo Gaggiolo,
    la sua schiera viene assalita dagli Orchetti. Isildur indossa l'Unico
    Anello, ma l'Anello lo tradisce e gli scivola dal dito mentre cerca di
    fuggire a nuoto: gli Orchetti lo uccidono e l'Anello sprofonda nell'Anduin.
    Muoiono anche i suoi tre figli maggiori. Ohtar porta a Imladris i frantumi
    di Narsil.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anni 2-3; Libro I, capitolo 2"
  certezza: certa
  note: >-
    L'Anello resta perduto nel fiume per circa 2.500 anni, fino al 2463.

- id: divisione-arnor
  titolo: Arnor si divide
  tipo: politica
  data:
    era: terza
    anno: 861
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 861"
  luoghi:
    - Arnor
    - Arthedain
    - Cardolan
    - Rhudaur
    - Fornost
  fa_parte_di: null
  partecipanti:
    - nome: Eärendur
      parte: Arnor
      ruolo: re
      esito: muore
    - nome: i tre figli di Eärendur
      parte: Arnor
      ruolo: eredi
      esito: si dividono il regno
  breve: >-
    Alla morte di re Eärendur il regno del Nord si spezza fra i suoi tre
    figli: nascono Arthedain, Cardolan e Rhudaur.
  lungo: >-
    Alla morte di Eärendur, decimo re di Arnor, i suoi tre figli si disputano
    l'eredità. Il regno del Nord viene diviso in tre reami: Arthedain, il più
    fedele alla linea di Isildur, con capitale Fornost; Cardolan, a sud; e
    Rhudaur, a est, tra le Montagne Nebbiose e l'Eriador orientale. La
    divisione indebolisce per sempre i Dúnedain del Nord.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 861; Appendice A, Arnor"
  certezza: certa
  note: null

- id: istari
  titolo: Giungono gli Istari
  tipo: evento
  data:
    era: terza
    anno: 1000
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: circa
    calendario: terza
    testo: "Anno 1000 circa"
  luoghi:
    - Terra di Mezzo
    - Rifugi Oscuri
    - Isengard
  fa_parte_di: null
  partecipanti:
    - nome: Saruman
      parte: Istari
      ruolo: il Bianco, capo dell'ordine
      esito: si stabilisce a Isengard
    - nome: Gandalf
      parte: Istari
      ruolo: il Grigio
      esito: percorre l'Ovest
    - nome: Radagast
      parte: Istari
      ruolo: il Bruno
      esito: si dedica alle bestie e agli uccelli
    - nome: Círdan
      parte: Lindon
      ruolo: Signore dei Rifugi Oscuri
      esito: accoglie Gandalf e gli affida Narya
  breve: >-
    Trascorso circa un millennio, una prima ombra cala sulla Grande Foresta
    Verde e in Terra di Mezzo arrivano i Maghi.
  lungo: >-
    Intorno all'anno 1000 appaiono in Terra di Mezzo gli Istari, cinque
    messaggeri inviati dall'Occidente per contrastare Sauron e unire chi aveva
    la volontà di resistergli. Hanno l'aspetto di uomini anziani e invecchiano
    lentamente; a nessuno è permesso dominare Elfi e Uomini con la forza o con
    la paura. I due più importanti sono Curunír, che gli Uomini del Nord
    chiamano Saruman, e Mithrandir, cioè Gandalf. Saruman si stabilisce a
    Isengard; Gandalf non sceglie dimora fissa. Círdan lo accoglie ai Rifugi
    Oscuri e gli affida il suo Anello.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 1000 circa"
  certezza: certa
  note: >-
    L'epub non nomina i due Istari azzurri; i loro nomi si trovano in altre
    opere e vanno trattati come tradizione separata.

- id: ombra-bosco-attro
  titolo: L'ombra sul Bosco Atro
  tipo: evento
  data:
    era: terza
    anno: 1050
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 1050"
  luoghi:
    - Bosco Atro
    - Gondor
    - Harad
    - Eriador
  fa_parte_di: null
  partecipanti:
    - nome: Hyarmendacil
      parte: Gondor
      ruolo: re
      esito: conquista l'Harad
    - nome: i Periannath
      parte: Hobbit
      ruolo: popolo
      esito: compaiono per la prima volta nei documenti
  breve: >-
    Mentre Gondor tocca il culmine della potenza, un'ombra incombe sulla
    Foresta Verde, che comincia a chiamarsi Bosco Atro. Gli Hobbit compaiono
    per la prima volta nei documenti.
  lungo: >-
    Sotto il re Hyarmendacil Gondor conquista l'Harad e raggiunge l'apice della
    sua potenza. Nello stesso periodo un'ombra cade sulla Grande Foresta Verde,
    che la gente comincia a chiamare Bosco Atro. È il primo segno del risveglio
    di un potere malefico nel nord-est. In questi anni i Periannath, cioè gli
    Hobbit, vengono menzionati per la prima volta in documenti scritti, a
    proposito della loro venuta nell'Eriador.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 1050"
  certezza: certa
  note: null


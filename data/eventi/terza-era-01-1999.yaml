  breve: >-
    I Nazgûl riappaiono: il loro capo sale a nord e fonda Angmar, nemico dei
    Dúnedain. Gli Orchetti infestano le Montagne Nebbiose e molti Hobbit
    emigrano a Brea.
  lungo: >-
    Intorno al 1300 gli esseri malefici ricominciano a moltiplicarsi. Gli
    Orchetti pullulano sulle Montagne Nebbiose e attaccano i Nani; i Nazgûl
    riappaiono. Il loro capo, il Re degli Stregoni, si reca a nord e fonda il
    regno di Angmar, deciso a distruggere i Dúnedain del Nord. I Periannath
    emigrano verso ovest e molti si stabiliscono a Brea.
  fonti:

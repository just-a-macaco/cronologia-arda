      ruolo: re in fuga
      esito: annega nella Baia di Forochel
    - nome: Eärnur
      parte: Gondor
      ruolo: principe
      esito: guida la flotta del Lindon
    - nome: il Re degli Stregoni
      parte: Angmar
      ruolo: comandante
      esito: sconfitto, scompare dal Nord
    - nome: Glorfindel
      parte: Imladris

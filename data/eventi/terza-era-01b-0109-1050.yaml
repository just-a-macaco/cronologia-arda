  fa_parte_di: null
  partecipanti:
    - persona: ostoher
      parte: Gondor
      ruolo: re
      esito: ricostruisce la città
  breve: >-
    Re Ostoher ricostruisce Minas Anor, la futura Minas Tirith.
  lungo: >-
    Intorno al 420 re Ostoher ricostruisce e fortifica Minas Anor, la città
    sorta ai piedi del Mindolluin. Per ora è una roccaforte secondaria, ma
    diventerà la capitale di Gondor e la Minas Tirith della Guerra
    dell'Anello.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 420 circa"
  certezza: certa
  note: null


# Schede della Terza Era, anni 109-1050.
# Secondo blocco dell'Appendice B: i primi secoli di Gondor e Arnor.
# Fonte: Il Signore degli Anelli, Appendice B (Bompiani 2004).

- id: elrond-celebrian
  titolo: Elrond sposa Celebrían
  tipo: evento
  data:
    era: terza
    anno: 109
    mese: null
    giorno: null
    anno_fine: null
    precisione: anno
    qualificatore: null
    calendario: terza
    testo: "Anno 109"
  luoghi:
    - gran-burrone
  fa_parte_di: null
  partecipanti:
    - persona: elrond
      parte: Gran Burrone
      ruolo: sposo
      esito: sposa Celebrían
    - persona: celebrian
      parte: Lórien
      ruolo: sposa
      esito: sposa Elrond
  breve: >-
    Elrond sposa Celebrían, figlia di Celeborn e Galadriel: nasce la famiglia
    dei Mezzelfi di Gran Burrone.
  lungo: >-
    Elrond, signore di Gran Burrone, sposa Celebrían, figlia di Celeborn e
    Galadriel. Dal matrimonio nasceranno i gemelli Elladan e Elrohir e, molto
    più tardi, Arwen Undómiel. La casa di Gran Burrone diventa così il punto
    d'incontro delle due grandi linee elfiche e della discendenza di Elros.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, anno 109"
  certezza: certa
  note: null


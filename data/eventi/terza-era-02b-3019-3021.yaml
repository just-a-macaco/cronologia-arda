# Schede della Terza Era, 3019-3021 (seconda parte).
# Dalla battaglia della Valle alla fine della Terza Era.
# Fonte: Il Signore degli Anelli, Appendice B (Bompiani 2004).

- id: consiglio-capitani
  titolo: Il consiglio dei capitani
  tipo: consiglio
  data:
    era: terza
    anno: 3019
    mese: 3
    giorno: 16
    anno_fine: null
    precisione: giorno
    qualificatore: null
    calendario: contea
    testo: "16 marzo 3019"
  luoghi:
    - minas-tirith
  fa_parte_di: La Guerra dell'Anello
  partecipanti:
    - persona: aragorn
      parte: Gondor
      ruolo: comandante
      esito: propone la marcia sul Morannon
    - persona: gandalf
      parte: Istari
      ruolo: consigliere
      esito: sostiene il piano
    - persona: eomer
      parte: Rohan
      ruolo: comandante
      esito: partecipa
    - persona: imrahil
      parte: Dol Amroth
      ruolo: comandante
      esito: partecipa
  breve: >-
    I capitani decidono di marciare sul Morannon per distrarre Sauron e dare a
    Frodo il tempo di distruggere l'Anello.
  lungo: >-
    Il 16 marzo 3019 i capitani di Gondor e Rohan si riuniscono a Minas Tirith.
    Decidono di marciare sul Morannon con l'Esercito dell'Ovest: non per
    vincere, ma per attirare l'attenzione di Sauron e dare a Frodo il tempo di
    raggiungere il Monte Fato.
  fonti:
    - opera: Il Signore degli Anelli
      riferimento: "Appendice B, I Grandi Anni, 16 marzo 3019"
  certezza: certa
  note: null

